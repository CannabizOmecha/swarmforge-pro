name: AEGIS CI
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
concurrency:
  group: aegis-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Unit and API tests
        run: pytest -q
      - name: Compile
        run: python -m compileall -q aegis tests
      - name: Lint
        run: ruff check aegis tests
      - name: Validate JSON schemas and contracts
        run: python -c "from aegis.validation import _validator; _validator('event.schema.json'); _validator('evidence.schema.json'); print('JSON Schema contracts valid')"
      - name: Verify immutable policy manifest
        run: python scripts/verify_policy_manifest.py
      - name: Install pinned Open Policy Agent
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/opa" \
            https://github.com/open-policy-agent/opa/releases/download/v1.22.4/opa_linux_amd64_static
          echo "35e3b352e715e80624ead6c89930d8585f6f7d94cdc409eb2a9fe36620dcccba  $RUNNER_TEMP/opa" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/opa"
          "$RUNNER_TEMP/opa" version
      - name: Format, compile, and test Rego policy
        run: |
          "$RUNNER_TEMP/opa" fmt --fail policy
          "$RUNNER_TEMP/opa" check policy
          "$RUNNER_TEMP/opa" test policy -v
