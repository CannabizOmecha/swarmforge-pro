name: AEGIS CI
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Unit and API tests
        run: pytest -q
      - name: Compile
        run: python -m compileall -q aegis tests
      - name: Lint
        run: ruff check aegis tests
      - name: Validate JSON specifications
        run: python -c "import json,pathlib; [json.loads(p.read_text()) for p in pathlib.Path('spec').glob('*.json')]; print('JSON specifications valid')"
