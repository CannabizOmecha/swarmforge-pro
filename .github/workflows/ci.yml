name: AEGIS CI
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Unit and API tests
        run: pytest -q
      - name: Compile
        run: python -m compileall -q aegis tests
      - name: Diagnose and normalize store imports
        run: |
          ruff check --fix aegis/store.py || true
          sed -n '1,18p' aegis/store.py
      - name: Lint
        run: ruff check aegis tests
      - name: Validate JSON schemas and contracts
        run: python -c "from aegis.validation import _validator; _validator('event.schema.json'); _validator('evidence.schema.json'); print('JSON Schema contracts valid')"
