name: ASYA Foundation 0.1.0
on:
  push:
    branches: [asya-foundation-0.1.0]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  foundation-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile package
        run: python -m compileall -q asya_foundation tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
