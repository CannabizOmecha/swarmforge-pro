[build-system]
requires = ["setuptools>=69,<81", "wheel>=0.42,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-moe"
version = "0.3.0"
description = "Policy-constrained autonomous security assurance foundation"
requires-python = ">=3.11,<4"
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.27,<1",
    "pydantic>=2.6,<3",
    "jsonschema>=4.21,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "ruff>=0.4,<1"]

[tool.setuptools.packages.find]
include = ["aegis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
